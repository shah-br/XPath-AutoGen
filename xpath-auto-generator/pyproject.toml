[project]
name = "xpath-auto-generator"
version = "1.0.0"
description = "LLM-powered XPath auto generator using Playwright"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "playwright>=1.49.0",
    "openai>=1.55.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.6.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[project.scripts]
xpath-gen = "xpath_gen.main:cli"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that hit real browsers or network",
]

[tool.ruff]
line-length = 100
target-version = "py311"
